<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR camere · Rooftop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600&display=swap">
<script src="qrcode.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Figtree,sans-serif;background:#F4F5F8;color:#14224A;padding:24px 16px}
  .tools{max-width:820px;margin:0 auto 24px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(20,34,74,.08)}
  h1{font-family:Marcellus,serif;font-weight:400;font-size:26px;margin-bottom:6px}
  p{color:#555;font-size:14px;margin-bottom:12px}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
  input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #ccd;border-radius:10px}
  textarea{min-height:70px}
  button{margin-top:14px;font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:999px;background:#14224A;color:#fff;cursor:pointer}
  .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;max-width:820px;margin:0 auto}
  .card{background:#0f1838;color:#fff;border-radius:18px;padding:22px 18px;text-align:center;break-inside:avoid;page-break-inside:avoid;border:1px solid #9C7629}
  .card .logo{width:46px;height:46px;border-radius:50%}
  .card .k{font-size:9.5px;letter-spacing:.38em;color:#E7C77E;margin:10px 0 2px;padding-left:.38em}
  .card h2{font-family:Marcellus,serif;font-weight:400;font-size:28px;line-height:1.1}
  .card .qr{background:#fff;border-radius:12px;padding:10px;width:150px;height:150px;margin:14px auto 12px}
  .card .qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
  .card .l{font-size:12.5px;line-height:1.45}
  .card .l span{display:block;color:rgba(255,255,255,.65)}
  .card .room{margin-top:10px;font-size:11px;letter-spacing:.2em;color:#E7C77E}
  @media print{ body{background:#fff;padding:0} .tools{display:none} .sheet{grid-template-columns:repeat(3,1fr);gap:8mm;max-width:none}
    .card{-webkit-print-color-adjust:exact;print-color-adjust:exact} @page{size:A4;margin:10mm} }
</style>
</head>
<body>
<div class="tools">
  <h1>QR per le camere</h1>
  <p>1) Scrivi i numeri delle camere. 2) Premi "Crea". 3) Premi "Stampa" (A4, 9 cartoncini per foglio). Ogni QR apre il menu della terrazza con "Benvenuti · Camera …".</p>
  <label for="url">Indirizzo del menu</label>
  <input id="url" value="">
  <label for="rooms">Camere (separate da virgola o a capo). Lascia vuoto per un QR unico.</label>
  <textarea id="rooms" placeholder="101, 102, 103, 201, 202 …"></textarea>
  <button id="make">Crea</button> <button id="print">Stampa</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
const $ = s => document.querySelector(s);
$('#url').value = location.origin + '/rooftop/';
function qrImg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createDataURL(8, 0);
}
function make() {
  const base = $('#url').value.trim();
  const rooms = $('#rooms').value.split(/[\s,;]+/).map(r => r.trim()).filter(r => /^[\w-]{1,8}$/.test(r));
  const list = rooms.length ? rooms : [''];
  $('#sheet').innerHTML = list.map(r => {
    const link = r ? `${base}?room=${encodeURIComponent(r)}` : base;
    return `<div class="card"><img class="logo" src="/logo.png" alt=""><div class="k">ROOFTOP COCKTAIL BAR</div><h2>Hotel Concordia</h2>
      <div class="qr"><img src="${qrImg(link)}" alt="QR"></div>
      <div class="l">Inquadra e scopri il menu<span>Scan to see the menu</span></div>
      ${r ? `<div class="room">CAMERA ${r}</div>` : ''}</div>`;
  }).join('');
}
$('#make').onclick = make; $('#print').onclick = () => print();
make();
</script>
</body>
</html>
