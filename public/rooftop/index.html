<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Terrazza · Hotel Concordia</title>
<meta name="description" content="Rooftop menu · Hotel Concordia Roma">
<meta name="theme-color" content="#0b1230">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@300;400;500;600&display=swap">
<link rel="preload" as="image" href="media/view-sunset.jpg">
<style>
/* ============ colours per moment of the day ============ */
:root{
  --navy:#14224A; --gold:#E7C77E; --gold-d:#9C7629; --lemon:#F2C933;
  --ink:#fff; --ink-2:rgba(255,255,255,.72); --ink-3:rgba(255,255,255,.5);
  --glass:rgba(12,18,44,.42); --line:rgba(231,199,126,.32);
  --shade-top:rgba(5,10,30,.05); --shade-bot:rgba(6,10,28,.88);
  --accent:var(--gold); --glow:rgba(255,190,120,.0);
  --scroll:0;
  color-scheme:dark;
}
body[data-mode="morning"] .eyebrow{color:#fff}
body[data-mode="morning"]{ --accent:#F2D58F; --glass:rgba(20,34,74,.40); --shade-bot:rgba(14,26,58,.86); }
body[data-mode="sunset"] { --accent:#FFC98A; --glass:rgba(48,22,40,.40); --line:rgba(255,190,140,.36); --shade-bot:rgba(30,12,30,.88); }
body[data-mode="night"]  { --accent:#E7C77E; --glass:rgba(6,10,30,.50); --shade-bot:rgba(3,5,18,.92); }

*{box-sizing:border-box;margin:0;padding:0}
html{background:#0b1230;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:#0b1230;color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-weight:400;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ============ the living view (fixed behind everything) ============ */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0b1230}
.stage video,.stage .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;
  transform:scale(calc(1.06 + var(--scroll)*.10)) translateY(calc(var(--scroll)*-3%));will-change:transform,opacity}
.stage .on{opacity:1}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,var(--shade-top) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,calc(.10 + var(--scroll)*.45)) 55%,var(--shade-bot) 100%);transition:background 1.2s}

/* ============ intro curtain ============ */
.curtain{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0b1230;transition:opacity 1.1s ease .2s,visibility 0s 1.4s}
.curtain.gone{opacity:0;visibility:hidden}
.curtain img{width:92px;height:92px;border-radius:50%;opacity:0;animation:rise 1.2s .1s cubic-bezier(.2,.7,.2,1) forwards}
.curtain p{margin-top:18px;font-family:Marcellus,serif;letter-spacing:.42em;font-size:12px;color:var(--gold);text-align:center;opacity:0;animation:rise 1.2s .45s cubic-bezier(.2,.7,.2,1) forwards;padding-left:.42em}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ top bar ============ */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;transition:background .5s,backdrop-filter .5s}
.bar.solid{background:linear-gradient(180deg,rgba(6,10,28,.72),rgba(6,10,28,.35));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:9px;font-family:Marcellus,serif;font-size:15px;letter-spacing:.14em;opacity:0;transition:opacity .5s}
.bar.solid .brand{opacity:1}
.brand img{width:28px;height:28px;border-radius:50%}
.lang{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;letter-spacing:.12em;font-weight:600;background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ============ moment switch (morning / sunset / night) ============ */
.moments{display:inline-flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.moments button{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;font-size:13px;letter-spacing:.04em;color:var(--ink-2);transition:background .4s,color .4s}
.moments button svg{width:15px;height:15px}
.moments button[aria-pressed="true"]{background:var(--accent);color:#1b1530;font-weight:600}
.clock{margin-top:10px;font-size:12px;letter-spacing:.16em;color:var(--ink-2);text-transform:uppercase}
.clock b{color:var(--accent);font-weight:600}

/* ============ hero ============ */
main{position:relative;z-index:2}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:100svh;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 60% at 50% 72%,rgba(6,10,28,.55),rgba(6,10,28,0) 70%);opacity:calc(1 - var(--scroll))}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;
  padding:0 20px calc(env(safe-area-inset-bottom) + 40px)}
.hero .inner{transform:translateY(calc(var(--scroll)*-60px));opacity:calc(1 - var(--scroll)*1.6)}
.eyebrow,.hero .tag,.clock,.cue{text-shadow:0 1px 14px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4)}
.eyebrow{font-weight:600;font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);padding-left:.42em}
.hero h1{font-family:Marcellus,serif;font-weight:400;font-size:clamp(54px,16vw,108px);line-height:.95;letter-spacing:.01em;margin:14px 0 14px;
  text-shadow:0 6px 40px rgba(0,0,0,.35)}
.hero .tag{font-size:17px;font-weight:300;color:var(--ink-2);max-width:30ch;margin:0 auto 26px}
.hello{display:inline-block;margin-bottom:16px;font-size:12.5px;letter-spacing:.1em;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.hello[hidden]{display:none}
.cue{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.cue i{width:1px;height:46px;background:linear-gradient(var(--accent),transparent);animation:drip 2.2s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}

/* hero text appears word by word */
.split span{display:inline-block;opacity:0;transform:translateY(.4em);filter:blur(8px);transition:opacity 1s,transform 1s cubic-bezier(.2,.7,.2,1),filter 1s}
.ready .split span{opacity:1;transform:none;filter:none}

/* ============ section chips ============ */
.chipbar{position:sticky;top:calc(env(safe-area-inset-top) + 52px);z-index:15;margin-top:8px;transition:background .5s}
.chipbar.solid{background:linear-gradient(180deg,rgba(6,10,28,.35),rgba(6,10,28,.55));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:10px 16px;-webkit-mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--ink-2);font-size:13px;letter-spacing:.04em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(6,10,28,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:all .35s}
.chips a.on{background:var(--accent);color:#1b1530;border-color:transparent;font-weight:600}

/* ============ menu ============ */
.menu{max-width:620px;margin:0 auto;padding:20px 16px 40px}
.sec{position:relative;margin:26px 0 54px;scroll-margin-top:120px}
.sec-head{text-align:center;margin-bottom:22px}
.sec-head .num{font-family:Marcellus,serif;font-size:13px;letter-spacing:.3em;color:var(--accent)}
.sec-head h2{font-family:Marcellus,serif;font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.05;margin:6px 0 4px}
.sec-head p{color:var(--ink-2);font-size:14.5px;font-weight:300;letter-spacing:.02em}
.sec-head .rule{display:block;margin:14px auto 0;width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.card{border-radius:22px;padding:8px 20px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 20px 60px rgba(0,0,0,.25);transition:background 1.2s,border-color 1.2s}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.item:last-child{border-bottom:0}
.item h3{font-family:Marcellus,serif;font-weight:400;font-size:19px;line-height:1.25;letter-spacing:.01em}
.item .sub{grid-column:1/2;color:var(--ink-3);font-size:13.5px;font-weight:300;line-height:1.4}
.item .price{grid-row:1/2;grid-column:2;font-family:Marcellus,serif;font-size:18px;color:var(--accent);white-space:nowrap;align-self:start}
.item .price small{font-family:Figtree;font-size:11px;color:var(--ink-3);letter-spacing:.06em;margin-right:4px}
.pair{grid-column:1/-1;display:flex;gap:16px;margin-top:2px;font-size:13px;color:var(--ink-2)}
.pair span b{font-family:Marcellus,serif;font-weight:400;color:var(--accent);font-size:16px;margin-left:6px}

/* featured aperitivo */
.feature{text-align:center;padding:30px 24px 28px}
.feature .big{font-family:Marcellus,serif;font-size:64px;line-height:1;color:var(--accent);margin:8px 0 6px}
.feature .big small{font-size:18px;color:var(--ink-2);margin-left:4px}
.feature h3{font-family:Marcellus,serif;font-weight:400;font-size:24px}
.feature p{color:var(--ink-2);font-weight:300;font-size:15px;max-width:30ch;margin:6px auto 0}
.badge{display:inline-block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:6px 12px 6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--accent)}

/* interlude with the terrace video */
.interlude{position:relative;margin:10px -16px 60px;height:120svh}
.interlude .frame{position:sticky;top:12svh;height:76svh;margin:0 auto;width:calc(100% - 32px);max-width:620px;border-radius:28px;overflow:hidden;
  clip-path:inset(calc((1 - var(--p,0)) * 14%) calc((1 - var(--p,0)) * 10%) round 28px);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.interlude video,.interlude img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s;transform:scale(calc(1.25 - var(--p,0)*.25))}
.interlude .on{opacity:1}
.interlude .words{position:absolute;inset:auto 0 0;padding:28px 24px 30px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.interlude .words h2{font-family:Marcellus,serif;font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.1}
.interlude .words p{color:var(--ink-2);font-weight:300;margin-top:8px}

/* scroll reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.card .item{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.card.in .item{opacity:1;transform:none}

/* footer */
.foot{text-align:center;padding:30px 20px calc(env(safe-area-inset-bottom) + 50px);color:var(--ink-2);font-size:14px;font-weight:300}
.foot img{width:64px;height:64px;border-radius:50%;margin-bottom:16px}
.foot .notes{max-width:440px;margin:0 auto 22px;display:grid;gap:10px}
.foot .notes div{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.foot .notes b{color:var(--accent);font-weight:500}
.foot .sign{font-family:Marcellus,serif;letter-spacing:.3em;font-size:12px;color:var(--accent);margin-top:20px;padding-left:.3em}

@media (min-width:760px){ .bar{padding-left:28px;padding-right:28px} .menu{padding-top:40px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .rv,.card .item,.split span{opacity:1;transform:none;filter:none}
}
</style>
</head>

  <img class="poster" data-m="morning" src="media/view-morning.jpg" alt="">

<main>

      <div class="hello" id="hello" hidden></div>

  <div class="menu" id="menu"></div>

  <footer class="foot" id="foot"></footer>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const price = n => Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ',').replace(/0$/, '');
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const saveData = navigator.connection && navigator.connection.saveData;
let lang = store.get('tz-lang') || ((navigator.language || 'it').toLowerCase().startsWith('it') ? 'it' : 'en');
let mode = 'sunset', userPicked = false;

/* ===== real sunrise / sunset in Rome (simple NOAA formula) ===== */
function sunTimes(date) {
  const lat = 41.9, lng = 12.5, rad = Math.PI / 180;
  const day = Math.floor((Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()) - Date.UTC(2000, 0, 1, 12)) / 864e5) + 1;
  const n = day - lng / 360, M = (357.5291 + 0.98560028 * n) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const J = 2451545 + n + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.44 * rad));
  const w = Math.acos((Math.sin(-0.83 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec))) / rad;
  const toMs = j => (j - 2440587.5) * 864e5;
  return { rise: toMs(J - w / 360), set: toMs(J + w / 360) };
}
function autoMode(now = Date.now()) {
  const { rise, set } = sunTimes(new Date(now)), min = 6e4;
  if (now < rise - 30 * min || now > set + 45 * min) return 'night';
  if (now > set - 80 * min) return 'sunset';
  return 'morning';
}
const romeTime = ms => new Date(ms).toLocaleTimeString(lang === 'it' ? 'it-IT' : 'en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' });

/* ============================ build page ============================ */
function render() {
  const t = TXT[lang];
  document.documentElement.lang = lang;
  $('#lang').textContent = lang === 'it' ? 'EN' : 'IT';
  $$('[data-t]').forEach(el => { if (t[el.dataset.t]) el.textContent = t[el.dataset.t]; });
  const room = new URLSearchParams(location.search).get('room');
  if (room && /^[\w\- ]{1,8}$/.test(room)) { $('#hello').hidden = false; $('#hello').textContent = `${t.hello} ${room}`; }

  let chips = '', html = '', i = 0;
  for (const s of MENU) {
    if (s.id === 'interlude') {
      html += `<section class="interlude" id="interlude"><div class="frame">
        ${['morning', 'sunset', 'night'].map(m => `<img data-m="${m}" src="media/terrace-${m}.jpg" alt=""><video data-m="${m}" muted playsinline loop preload="none"></video>`).join('')}
        <div class="words"><h2>${t.interH}</h2><p>${t.interP}</p></div></div></section>`;
      continue;
    }
    i++;
    chips += `<a href="#${s.id}">${esc(s[lang])}</a>`;
    const head = `<div class="sec-head rv"><div class="num">${String(i).padStart(2, '0')}</div><h2>${esc(s[lang])}</h2>${s.note ? `<p>${esc(s.note[lang])}</p>` : ''}<span class="rule"></span></div>`;
    if (s.feature) {
      const it = s.item;
      html += `<section class="sec" id="${s.id}">${head}<div class="card feature rv"><span class="badge">${lang === 'it' ? 'Esperienza' : 'Experience'}</span>
        <div class="big">€${price(it.price)}<small>${esc(it.per[lang])}</small></div><h3>${esc(it[lang])}</h3><p>${esc(it.d[lang])}</p></div></section>`;
      continue;
    }
    const rows = s.items.map(([name, dIt, dEn, p, bottle]) => {
      const sub = lang === 'it' ? (dIt || '') : (dEn || dIt || '');
      const subLine = lang === 'it' && dEn && !dIt ? dEn : sub;   // Italian name + English under
      if (s.glass && bottle) return `<div class="item"><h3>${esc(name)}</h3>${subLine ? `<div class="sub">${esc(subLine)}</div>` : ''}
        <div class="pair"><span>${t.glass}<b>€${price(p)}</b></span><span>${t.bottle}<b>€${price(bottle)}</b></span></div></div>`;
      return `<div class="item"><h3>${esc(name)}</h3><div class="price">€${price(p)}</div>${subLine ? `<div class="sub">${esc(subLine)}</div>` : ''}</div>`;
    }).join('');
    html += `<section class="sec" id="${s.id}">${head}<div class="card rv">${rows}</div></section>`;
  }
  $('#chips').innerHTML = chips;
  $('#menu').innerHTML = html;
  const hours = SETTINGS.hours[lang];
  $('#foot').innerHTML = `<img src="/logo.png" alt="Hotel Concordia"><div class="notes">
    ${hours ? `<div><b>${t.hours}</b> · ${esc(hours)}</div>` : ''}
    <div>${t.cover} <b>€${price(SETTINGS.coverFee)}</b> ${t.perPerson}</div>
    <div>${t.room}</div><div>${t.allergens}</div></div>
    <div class="sign">HOTEL CONCORDIA · ROMA</div>`;
  observe();
  setMode(mode, true);
  tickClock();
}

/* ============================ moments ============================ */
function setMode(m, quiet) {
  mode = m;
  document.body.dataset.mode = m;
  $$('#moments button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  const meta = { morning: '#1b2c5c', sunset: '#3a1f3a', night: '#05081c' }[m];
  $('meta[name="theme-color"]').content = meta;
  swap($('#stage'), m);
  const inter = $('#interlude .frame'); if (inter) swap(inter, m, !interVisible);
  fx.mode = m;
}
function swap(root, m, lazy) {
  root.querySelectorAll('[data-m]').forEach(el => {
    const on = el.dataset.m === m;
    if (el.tagName === 'VIDEO') {
      if (on && !reduce && !saveData && !lazy) {
        if (!el.src) { el.src = (root.id === 'stage' ? 'media/view-' : 'media/terrace-') + m + '.mp4'; el.load(); }
        el.play().then(() => el.classList.add('on')).catch(() => {});
        el.addEventListener('playing', () => el.dataset.m === mode && el.classList.add('on'), { once: true });
      } else { el.classList.remove('on'); if (!on) el.pause(); }
    } else el.classList.toggle('on', on);
  });
}
function tickClock() {
  const t = TXT[lang], now = Date.now(), { set } = sunTimes(new Date(now));
  $('#clock').innerHTML = `${t.now} <b>${romeTime(now)}</b> · ${t.sunsetAt} <b>${romeTime(set)}</b>`;
  if (!userPicked) { const a = autoMode(now); if (a !== mode) setMode(a); }
}

/* ============================ scroll effects ============================ */
let interVisible = false, io;
function observe() {
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: .08 });
  $$('.rv').forEach(el => io.observe(el));
  $$('.card').forEach(c => c.querySelectorAll('.item').forEach((it, k) => it.style.transitionDelay = Math.min(k * 70, 700) + 'ms'));
  const inter = $('#interlude');
  if (inter) new IntersectionObserver(([e]) => {
    interVisible = e.isIntersecting;
    if (interVisible) swap(inter.querySelector('.frame'), mode); else inter.querySelectorAll('video').forEach(x => x.pause());
  }, { rootMargin: '200px 0px' }).observe(inter);
}
let ticking = false;
function onScroll() {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const y = scrollY, h = innerHeight;
    document.documentElement.style.setProperty('--scroll', Math.min(y / h, 1).toFixed(3));
    $('#bar').classList.toggle('solid', y > h * .55);
    $('#chipbar').classList.toggle('solid', $('#chipbar').getBoundingClientRect().top <= $('#bar').offsetHeight + 1);
    const inter = $('#interlude');
    if (inter) { const r = inter.getBoundingClientRect(); const p = Math.max(0, Math.min(1, (h - r.top) / (h * 0.9))); inter.style.setProperty('--p', p.toFixed(3)); }
    // highlight the chip of the section on screen
    let cur = null; for (const s of $$('.sec')) if (s.getBoundingClientRect().top < h * .4) cur = s.id;
    $$('#chips a').forEach(a => { const on = a.getAttribute('href') === '#' + cur; if (on && !a.classList.contains('on')) a.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); a.classList.toggle('on', on); });
  });
}
addEventListener('scroll', onScroll, { passive: true });

/* ============ living sky: stars, city lights, sun glow, light dust ============ */
const fx = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W, H, dpr, stars = [], lights = [], motes = [], shoot = null, t0 = performance.now(), mix = { morning: 0, sunset: 1, night: 0 };
  const api = { mode: 'sunset' };
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr;
    const r = (a, b) => a + Math.random() * (b - a);
    stars = Array.from({ length: Math.round(W * H / 4200) }, () => ({ x: r(0, W), y: Math.pow(Math.random(), 1.6) * H * .46, s: r(.3, 1.4), p: r(0, 6.3), v: r(.6, 2.2) }));
    lights = Array.from({ length: 46 }, () => ({ x: r(0, W), y: r(H * .47, H * .62), s: r(.8, 2.4), p: r(0, 6.3), v: r(.4, 1.6), c: Math.random() < .8 ? [255, 196, 120] : [255, 236, 200] }));
    motes = Array.from({ length: 26 }, () => ({ x: r(0, W), y: r(0, H), s: r(.6, 2), vx: r(-.08, .08), vy: r(-.18, -.04), p: r(0, 6.3) }));
  }
  function frame(now) {
    const t = (now - t0) / 1000;
    for (const k in mix) mix[k] += ((api.mode === k ? 1 : 0) - mix[k]) * 0.04;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const fade = 1 - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scroll') || 0) * .5;
    // night: stars + shooting star + warm city lights near the horizon
    if (mix.night > .01) {
      const a = mix.night * fade;
      for (const s of stars) { ctx.globalAlpha = a * (.45 + .55 * Math.sin(t * s.v + s.p) ** 2); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.3); ctx.fill(); }
      if (!shoot && Math.random() < .004) shoot = { x: Math.random() * W * .7 + W * .2, y: Math.random() * H * .2, life: 0 };
      if (shoot) { shoot.life += .018; const L = shoot.life, x = shoot.x - L * 260, y = shoot.y + L * 120;
        const g = ctx.createLinearGradient(x, y, x + 70, y - 32); g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalAlpha = a * Math.sin(Math.PI * Math.min(L, 1)); ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 70, y - 32); ctx.stroke(); if (L > 1) shoot = null; }
      for (const l of lights) { const k = .55 + .45 * Math.sin(t * l.v + l.p); const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.s * 6);
        g.addColorStop(0, `rgba(${l.c},${.9 * k})`); g.addColorStop(1, `rgba(${l.c},0)`); ctx.globalAlpha = a * .8; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(l.x, l.y, l.s * 6, 0, 6.3); ctx.fill(); }
    }
    // sunset: a soft breathing sun glow on the horizon
    if (mix.sunset > .01) {
      const a = mix.sunset * fade, x = W * .72, y = H * .47, R = Math.max(W, H) * (.42 + .02 * Math.sin(t * .5));
      const g = ctx.createRadialGradient(x, y, 0, x, y, R); g.addColorStop(0, 'rgba(255,214,150,.55)'); g.addColorStop(.25, 'rgba(255,150,90,.22)'); g.addColorStop(1, 'rgba(255,120,90,0)');
      ctx.globalAlpha = a; ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    }
    // morning + sunset: golden dust in the air
    const dust = (mix.morning * .6 + mix.sunset) * fade;
    if (dust > .01) for (const m of motes) {
      m.x += m.vx; m.y += m.vy; if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
      ctx.globalAlpha = dust * (.25 + .25 * Math.sin(t + m.p)); ctx.fillStyle = mix.sunset > .5 ? '#ffd9a0' : '#fff6dc'; ctx.beginPath(); ctx.arc(m.x, m.y, m.s, 0, 6.3); ctx.fill();
    }
    // morning: light rays from the top
    if (mix.morning > .01) {
      const a = mix.morning * fade * (.10 + .04 * Math.sin(t * .4));
      const g = ctx.createLinearGradient(W, 0, W * .2, H * .6); g.addColorStop(0, 'rgba(255,250,230,1)'); g.addColorStop(1, 'rgba(255,250,230,0)');
      ctx.globalAlpha = a; ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
    if (!document.hidden) requestAnimationFrame(frame);
  }
  if (!reduce) { size(); addEventListener('resize', size); requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) requestAnimationFrame(frame); }); }
  return api;
})();

/* ============================ start ============================ */
$('#title').innerHTML = 'La Terrazza'.split(' ').map((w, i) => `<span style="transition-delay:${.25 + i * .18}s">${w}</span>`).join(' ');
$('#moments').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { userPicked = true; setMode(b.dataset.m); } });
$('#lang').addEventListener('click', () => { lang = lang === 'it' ? 'en' : 'it'; store.set('tz-lang', lang); render(); onScroll(); });
mode = autoMode();
render(); onScroll();
setInterval(tickClock, 30000);
addEventListener('load', () => setTimeout(() => { $('#curtain').classList.add('gone'); document.body.classList.add('ready'); }, 900));
setTimeout(() => { $('#curtain').classList.add('gone'); document.body.classList.add('ready'); }, 3500);
</script>
</body>
